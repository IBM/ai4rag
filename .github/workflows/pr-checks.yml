name: PR Checks

on:
  pull_request:
    branches:
      - '**'

jobs:
  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for copyright check (git history)

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --extra code_check

      - name: Run Black check
        run: uv run black --check --diff ai4rag/

      - name: Run isort check
        run: uv run isort --check-only --diff ai4rag/

      - name: Run Pylint
        run: uv run pylint ai4rag/

      - name: Run copyright check
        run: bash scripts/copyright_check.sh

  tests:
    name: Unit Tests with Coverage
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests with coverage
        run: uv run pytest tests/unit --cov=ai4rag --cov-report=term --cov-report=html --cov-fail-under=90
